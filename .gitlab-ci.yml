# ========================================================
# Назначение переменных для сборки пакетов в этом проекте
# 1. Создаем токен для проекта
# 2. Добавляем пользователя GitLab..
# 3. В настройках проекта выключаем Use separate caches for protected branches
# 4. Включаем в проекте доступ к общим ранерам
# 5. Создаем в автотестах ветку под проект
# 6. Добавляем фаайл build.txt в .gitignore, что бы объединение веток не перебивало билды для версии
# 7. Добавляем в файл .gitattributes  build.txt и .gitignore
# ========================================================
variables:
    # Каталог в котором будет работать сервис
    DESTINATION_DIR: "flat-check"

    # Общие значения которые для всех вариантов пакетов. Меняются в звисимосте от каждой сборки.
    PKG_NAME: "flat-check"
    SUMMARY: "Script for Flat Service"
    DESCRIPTION: "Script for Flat Service"

    # Имя бинарника
    BINARY_FILE: "flat_check_agent.sh"
    # Конфирурационный файл
    CONFIG_FILE: "flat_check_agent.conf"
    # Файл сервиса
    SERVICE_FILE: $PKG_NAME.service

    # Зависимости для каждой из систем
    # ИЗМЕНЕНО: cron/cronie больше не нужны — агент теперь демон (Type=simple),
    # заданий cron не ставит. jq нужен flat-check-set-push-urls.sh, curl — агенту.
    DEPENDS_astra_7: jq, curl
    DEPENDS_astra_8: jq, curl
    DEPENDS_debian_11: jq, curl
    DEPENDS_debian_12: jq, curl
    DEPENDS_debian_13: jq, curl
    DEPENDS_redos_7: jq, curl
    DEPENDS_redos_8: jq, curl
    #DEPENDS_redos_9: jq, curl - на будушее

    # Сервисы с которыми не работает.
    CONFLICTS: {}


    # #########################################################
        # Сервисный файл не генирируется, а лежит локально (agent/flat-check.service.example)
    # #########################################################

    # Переменные для файла .service
    SERVICE_TYPE: {}

    # Запуск в .service (ExecStart)
    EXEC_STARTPRE: {}
    EXEC_START: $DESTINATION_PATH/$BINARY_FILE app
    EXEC_STOP: {}


    SUDO_FILE: {}

    #########################################################
    # ID группы Telegram
    TELEGRAM_CHAT_ID: -1002377507078
    #########################################################


    # Если требуется вводить лицензии, просто закоменти переменную
    POSTINST_LICENSE: cmd_color "echo 'On is licensed'"

###################################################################
###################################################################
###################################################################
