# flat_check.packages.conf — каталог пакетов FLAT/FCS для flat_check / flat_check_2
# Лежит рядом со скриптом. Если файла нет — скрипт использует встроенный fallback.
# Формат: _pkg_set NAME PRODUCT [LEGACY] [PORTS] [API] [DEPS]
# Пустые PORTS/API/DEPS можно не указывать (хвост опускается).
# LEGACY — как в текущем каталоге (без спорных rename из комментариев Confluence).
# Требует предварительно определённой функции _pkg_set в вызывающем скрипте.

